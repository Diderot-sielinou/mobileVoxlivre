name: voxlivre
description: "Voxlivre : lecture synchronisée audio-texte à partir de PDF."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  freezed_annotation: ^3.1.0
  go_router: ^17.0.0
  json_annotation: ^4.9.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  logging: ^1.3.0
  meta: ^1.16.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  path: ^1.9.1
  shared_preferences_platform_interface: ^2.4.1
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true

  # Polices embarquées (licence OFL, textes dans assets/fonts/) : aucune
  # requête réseau pour afficher du texte, l'app reste lisible hors ligne.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-400.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-700.ttf
          weight: 700
